<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="纯前端贪吃蛇小游戏，浏览器直接打开即可运行。" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-app" role="main">
    <header class="game-header">
      <h1 class="game-title">贪吃蛇</h1>

      <!-- HUD：当前分数、最高分、难度选择 -->
      <div class="hud" aria-live="polite">
        <div class="hud-item">
          <span class="hud-label" id="score-label">当前分数</span>
          <span class="hud-value" id="score" aria-labelledby="score-label">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label" id="high-label">最高分</span>
          <span class="hud-value" id="high-score" aria-labelledby="high-label">0</span>
        </div>
        <div class="hud-item">
          <label class="hud-label" for="difficulty">难度</label>
          <select id="difficulty" aria-label="选择难度" autocomplete="off">
            <option value="easy">慢（200ms）</option>
            <option value="normal" selected>中（140ms）</option>
            <option value="hard">快（90ms）</option>
          </select>
        </div>
      </div>
    </header>

    <!-- 游戏区域：Canvas + 状态覆盖层 -->
    <section class="board-wrap" aria-label="游戏区域">
      <canvas
        id="board"
        tabindex="0"
        role="img"
        aria-label="贪吃蛇棋盘，按方向键或 WASD 开始，空格暂停或继续"
      ></canvas>
      <div id="overlay" class="overlay" aria-live="assertive">
        <p id="overlay-text">按方向键 / WASD 开始</p>
      </div>
    </section>

    <!-- 控件 -->
    <footer class="controls">
      <button id="restart" type="button" aria-label="重新开始游戏">重新开始</button>
      <p class="hint" id="hint">方向键 / WASD 移动 · 空格暂停 · 滑动触屏控制</p>
    </footer>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
